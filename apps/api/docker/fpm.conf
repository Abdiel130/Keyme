[global]
error_log = /proc/self/fd/2

[www]
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Sin access log: nada de rutas ni cuerpos de peticiones en los registros de PHP.
access.log = /dev/null
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
