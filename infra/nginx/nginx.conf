worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; application/wasm wasm; }
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 30;
  # Sin access log: nada de rutas ni IPs del vault en registros.
  access_log off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

  include /etc/nginx/conf.d/*.conf;
}
