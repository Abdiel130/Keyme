expose_php = Off
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 32M
max_execution_time = 60
display_errors = Off
log_errors = On
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64

; Defensa en profundidad contra PHP2Shell (CVE-2026-109618/109619), además del
; parche de 8.5.12. La API no usa sesiones ni progreso de subida, y los
; backtraces en errores fatales no aportan nada en producción.
session.upload_progress.enabled = Off
fatal_error_backtraces = Off
